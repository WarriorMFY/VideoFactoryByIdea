<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i2v-probe · 分段取锚 · 对照实验</title>
<style>
  :root{--bg:#0e1116;--panel:#151a21;--panel2:#1b222b;--line:#272f3a;--tx:#e6edf3;
        --mu:#8b98a8;--dim:#5d6875;--ok:#4cc9b0;--warn:#e3b341;--bad:#f85149;--acc:#58a6ff;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1560px;margin:0 auto;padding:18px 20px 60px;display:grid;
        grid-template-columns:238px minmax(0,1fr);gap:16px 22px;align-items:start}
  main{min-width:0}
  aside{position:sticky;top:14px;display:flex;flex-direction:column;gap:8px;
        max-height:calc(100vh - 28px)}
  .hist{display:grid;gap:6px;overflow:auto;padding-right:3px}
  .hitem{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:7px 8px;cursor:pointer;transition:border-color .12s}
  .hitem:hover{border-color:#3a4656}
  .hitem.on{border-color:var(--acc);background:#16222f;box-shadow:0 0 0 1px #1d3b5c inset}
  .hitem.dead{opacity:.5}
  .hitem .th{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;
             display:block;background:#0b0f14;margin-bottom:5px}
  .hitem .ph{width:100%;aspect-ratio:16/9;border-radius:5px;background:#0b0f14;
             margin-bottom:5px;display:grid;place-items:center;font:10px var(--mono);color:var(--dim)}
  .hitem .r1{display:flex;align-items:center;gap:5px;font:600 11.5px var(--mono);color:var(--tx)}
  .hitem .r2{font:10px var(--mono);color:var(--dim);margin-top:2px;
             display:flex;gap:6px;flex-wrap:wrap}
  .hitem .tag{font:9.5px var(--mono);padding:1px 4px;border-radius:3px;background:#4a2326;color:#f08c8c;margin-left:auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
         grid-column:1/-1;padding-bottom:14px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px;font-weight:600}
  h1 span{color:var(--acc)}
  .sub{color:var(--mu);font-size:12.5px;margin-top:2px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  input[type=text],textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:7px;padding:9px 11px;font:13px/1.5 inherit;outline:none}
  input[type=text]{flex:1;min-width:280px;font-family:var(--mono);font-size:12.5px}
  textarea{width:100%;min-height:96px;resize:vertical}
  input:focus,textarea:focus,select:focus{border-color:#3a4c63}
  button{background:#1d2a3a;border:1px solid #2f4356;color:var(--tx);border-radius:7px;
         padding:9px 16px;font-size:13px;cursor:pointer}
  button:hover{background:#243549}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:#1f4a44;border-color:#2c6a60;color:#c9f2ea}
  button.mini{padding:3px 9px;font-size:11.5px;border-radius:6px;background:#1a232e;border-color:#2b3947}
  section{margin-top:18px}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .hd h2{margin:0;font-size:13px;font-weight:600;color:var(--mu);letter-spacing:.4px}
  .hd .n{font:11.5px var(--mono);color:var(--dim)}
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .seg{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;
       cursor:pointer;transition:border-color .12s}
  .seg:hover{border-color:#3a4656}
  .seg.on{border-color:var(--acc);box-shadow:0 0 0 1px #1d3b5c inset}
  .seg img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
  .seg .m{padding:8px 9px}
  .seg .t{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .sid{font:600 11.5px var(--mono);background:#2a3542;border-radius:4px;padding:2px 5px;color:#c9d1d9}
  .dur{font:11.5px var(--mono);color:var(--mu)}
  .flag{margin-left:auto;font:10.5px var(--mono);padding:2px 6px;border-radius:4px;
        background:#2a3542;color:var(--mu)}
  .flag.ok{background:#1f4a44;color:#8ee3d3}
  .flag.模糊{background:#4a3f1f;color:#e3b341}
  .flag.黑帧{background:#4a2326;color:#f08c8c}
  .move{font:10.5px var(--mono);color:var(--dim)}
  .seg .thumb{position:relative;display:block;line-height:0}
  .seg .play{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;
    border:1px solid rgba(230,237,243,.35);background:rgba(11,15,20,.7);color:var(--tx);
    font-size:10px;padding:0;display:grid;place-items:center;cursor:pointer;opacity:.85;
    transition:opacity .12s,background .12s,transform .12s}
  .seg .play:hover{opacity:1;background:var(--acc);border-color:var(--acc);color:#08121f;transform:scale(1.08)}
  .seg.playing .play{background:var(--acc);border-color:var(--acc);color:#08121f;opacity:1}
  .seg .badge{position:absolute;left:6px;bottom:6px;font:10px var(--mono);color:#dfe8f2;
    background:rgba(11,15,20,.62);border-radius:3px;padding:1px 5px}
  .pmodal{position:fixed;inset:0;background:rgba(6,9,13,.78);display:grid;place-items:center;
    z-index:50;padding:24px}
  .pmodal[hidden]{display:none}
  .pbox{width:min(880px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .phead{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)}
  .phead b{font:600 12.5px var(--mono);color:var(--tx)}
  .phead .sp{flex:1}
  .phead button{padding:4px 10px;font-size:12px;border-radius:6px}
  .pbox video{width:100%;display:block;background:#000;max-height:70vh}
  .pfoot{padding:8px 13px;font:11px var(--mono);color:var(--dim);border-top:1px solid var(--line)}
  .logs{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
        height:150px;overflow:auto;font:11.5px/1.6 var(--mono);color:#93a1b0;white-space:pre-wrap}
  .res{display:grid;grid-template-columns:1fr 300px;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .card video{width:100%;border-radius:7px;display:block;background:#000}
  .vtab{display:flex;gap:6px;margin:6px 0 6px}
  .vtab button{font:11px var(--mono);padding:4px 10px;border-radius:99px;cursor:pointer;
    background:transparent;border:1px solid var(--line);color:var(--dim)}
  .vtab button.on{background:#1f4a44;border-color:#2c6a60;color:#c9f2ea}
  .vtab button:disabled{opacity:.35;cursor:not-allowed}
  .lbl{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim);margin:4px 0 2px}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
  .kpi b{display:block;font:600 14px var(--mono)}
  .kpi i{font-style:normal;font-size:10px;color:var(--dim)}
  .zones{width:100%;border-radius:7px;margin-top:9px;border:1px solid var(--line)}
  /* 人工批注：结果栏下面一块，自动保存 */
  .note{margin-top:12px;border-top:1px dashed var(--line);padding-top:9px}
  .nh{display:flex;justify-content:space-between;align-items:baseline;font:11px var(--mono);color:var(--dim)}
  .nh b{color:var(--mu);font-weight:600;letter-spacing:.4px}
  .ns{font-size:10.5px;color:var(--dim)}
  .ns.dirty{color:var(--warn)}
  .ns.done{color:var(--ok)}
  .ns.bad{color:var(--bad)}
  .nt{width:100%;box-sizing:border-box;margin-top:6px;min-height:62px;resize:vertical;
      font:12.5px/1.65 var(--sans,system-ui);background:var(--panel2);border:1px solid var(--line);
      border-radius:7px;padding:8px 10px;color:var(--tx);outline:none}
  .nt:focus{border-color:#2c6a60}
  .nt::placeholder{color:#4b5563}
  .empty{color:var(--dim);font-size:12.5px;padding:14px 0}
  .err{color:#f08c8c;font-size:12.5px}
  .runs{display:grid;gap:12px;margin-top:10px}
  .rt{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mu);margin-bottom:8px}
  .rt b{color:var(--tx);font-weight:500}
  .pill{font:10.5px var(--mono);border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>i2v-probe <span>·</span> 分段取锚 · 对照实验</h1>
      <div class="sub">源片分段 → 取段首帧当锚 → 只改提示词生成 → 与原段双联对照</div>
    </div>
    <div class="sub" id="hint">本地服务</div>
  </header>

  <aside>
    <div class="hd" style="margin-bottom:0"><h2>历史</h2><span class="n" id="histN">0</span></div>
    <div class="hist" id="hist"><div class="empty">还没有记录</div></div>
  </aside>

  <main>
  <section>
    <div class="row">
      <input type="text" id="path" placeholder="本地视频绝对路径，如 F:\...\source.mp4">
      <label class="pill">扫描 <input id="secs" type="text" value="120" style="width:46px;background:transparent;border:0;color:var(--tx);font:12px var(--mono)"> 秒</label>
      <button id="btnIngest">分段</button>
      <span class="sub" id="ingState"></span>
    </div>
  </section>

  <section>
    <div class="hd"><h2>段条</h2><span class="n" id="segN">—</span></div>
    <div class="strip" id="strip"><div class="empty">先粘一个本地视频路径，点「分段」</div></div>
  </section>

  <section>
    <div class="hd"><h2>实验</h2><span class="n" id="selN">未选段</span></div>
    <div class="row" style="margin-bottom:9px">
      <select id="group">
        <option value="P0">P0 静止（底噪）</option>
        <option value="P1">P1 介质微动</option>
        <option value="M1">M1 动作幅度</option>
        <option value="M2">M2 主体数量</option>
        <option value="M3">M3 镜头运动</option>
        <option value="M4">M4 时间尺度</option>
        <option value="M5">M5 因果链</option>
        <option value="X1">X1 结构完整性</option>
        <option value="X2">X2 内容替换</option>
        <option value="X3">X3 新增元素</option>
        <option value="X4">X4 文字符号</option>
        <option value="X5">X5 环境重构</option>
      </select>
      <span class="pill">16:9 · 0.6MP · 5s 起</span>
      <span class="pill" id="costPill">≈21.4 积分/条</span>
      <span style="flex:1"></span>
      <button class="primary" id="btnRun" disabled>跑一条</button>
    </div>
    <div class="lbl" style="margin-bottom:4px">
      <span>提示词</span>
      <span style="display:flex;align-items:center;gap:8px">
        <b id="cardName" style="font-weight:500;color:var(--mu)"></b>
        <button class="mini" id="btnCard" disabled>填入基线卡</button>
      </span>
    </div>
    <textarea id="prompt" placeholder="从基线卡起手，一次只改一个变量。手写时按因果链：先发生什么 → 随后 → 终态。"></textarea>
    <div class="logs" id="logs" style="margin-top:10px">等待操作…</div>
  </section>

  <section>
    <div class="hd"><h2>结果</h2><span class="n" id="runN">0 条</span>
      <button class="mini" id="btnAll" hidden>看全部</button></div>
    <div class="runs" id="runs"><div class="empty">还没有实验记录</div></div>
  </section>
  </main>
</div>

<div class="pmodal" id="pModal" hidden>
  <div class="pbox">
    <div class="phead">
      <b id="pTitle">原片</b><span class="sp"></span>
      <button id="pClose">关闭 ESC</button>
    </div>
    <video id="pVid" controls autoplay loop playsinline></video>
    <div class="pfoot" id="pFoot"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let VID = null, SEL = null, SEGS = [], POLL = null, CURPLAY = "", CARDS = {};
let STATE = { runs: [] }, HISTORY = [], FOCUS = null;

const api = async (p, opt) => {
  const r = await fetch(p, opt);
  const t = await r.text();
  try { return JSON.parse(t); } catch { return { error: t.slice(0, 200) }; }
};

function log(line){
  const el = $("#logs");
  el.textContent += "\n" + line;
  el.scrollTop = el.scrollHeight;
}

async function pollJob(jid, onDone){
  clearInterval(POLL);
  let seen = 0;
  POLL = setInterval(async () => {
    const j = await api("/api/job/" + jid);
    if (!j || j.error) { clearInterval(POLL); return; }
    const lines = j.log || [];
    for (; seen < lines.length; seen++) log(lines[seen]);
    if (j.status === "done") { clearInterval(POLL); onDone(j.result, null); }
    if (j.status === "error") { clearInterval(POLL); onDone(null, lines.slice(-3).join(" | ") || "失败"); }
  }, 900);
}

// ---- 分段 ----
$("#btnIngest").onclick = async () => {
  const path = $("#path").value.trim();
  if (!path) return;
  $("#btnIngest").disabled = true; $("#ingState").textContent = "收片中…";
  $("#logs").textContent = "开始分段";
  const { job } = await api("/api/ingest", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path, secs: Number($("#secs").value) || 120 })
  });
  pollJob(job, (res, err) => {
    $("#btnIngest").disabled = false;
    if (err) { $("#ingState").innerHTML = `<span class="err">${err}</span>`; return; }
    VID = res.vid; SEGS = res.segments || [];
    $("#ingState").textContent = `${SEGS.length} 段 · 切点 ${ (res.cuts||[]).map(x=>x.toFixed(2)).join(" / ") || "无" }`;
    renderStrip(); refresh();
  });
};

function renderStrip(){
  if (!SEGS.length) { $("#strip").innerHTML = '<div class="empty">没切出段</div>'; return; }
  $("#segN").textContent = SEGS.length + " 段（上限 12，超出的已抽样）";
  $("#strip").innerHTML = SEGS.map(s => `
    <div class="seg${SEL===s.seg?" on":""}${CURPLAY===s.seg?" playing":""}" data-seg="${s.seg}">
      <div class="thumb">
        <img src="/probe/src/${VID}/${s.anchor}" loading="lazy">
        <span class="badge">${s.dur.toFixed(2)}s</span>
        <button class="play" data-play="${s.seg}" title="播放原始分段">▶</button>
      </div>
      <div class="m">
        <div class="t"><span class="sid">${s.seg}</span>
          <span class="flag ${s.quality.flag}">${s.quality.flag}</span></div>
        <div class="move">${s.start.toFixed(2)}–${s.end.toFixed(2)} · 位移 ${s.move_pct_per_s}%/s</div>
      </div>
    </div>`).join("");
  $("#strip").querySelectorAll(".seg").forEach(el => el.onclick = () => {
    SEL = el.dataset.seg; renderStrip(); $("#btnRun").disabled = false;
    $("#selN").textContent = `已选 ${SEL}`;
    loadCard(SEL, false);
  });
  $("#strip").querySelectorAll(".play").forEach(b => b.onclick = ev => {
    ev.stopPropagation();          // 只播放，不改当前选中的锚
    playSeg(b.dataset.play);
  });
}

// ---- 基线卡 ----
function cardName(seg){
  const c = CARDS[seg];
  $("#cardName").textContent = c ? c.name : "";
  $("#btnCard").disabled = !(c && c.prompt);
  return c;
}

function loadCard(seg, force){
  const c = cardName(seg);
  const ta = $("#prompt");
  if (c && c.prompt && (force || !ta.value.trim())) {
    ta.value = c.prompt;
    log(`已载入基线卡 ${seg}：${c.desc}`);
  } else if (c && !c.prompt) {
    log(`${seg} 没有基线卡：${c.risk}`);
  }
}
$("#btnCard").onclick = () => { if (SEL) loadCard(SEL, true); };

// ---- 播放原始分段 ----
function playSeg(seg){
  const s = SEGS.find(x => x.seg === seg);
  if (!s) return;
  CURPLAY = seg;
  $("#pTitle").textContent = `${seg} · ${s.start.toFixed(2)}–${s.end.toFixed(2)}s 原片`;
  const foot = `位移 ${s.move_pct_per_s}%/s · 清晰度 ${s.quality.laplacian}（${s.quality.flag}）· ${s.quality.w}×${s.quality.h}`;
  $("#pFoot").textContent = "正在准备该段原片…";
  const v = $("#pVid");
  v.onloadeddata = () => { $("#pFoot").textContent = foot; };
  v.onerror = () => { $("#pFoot").innerHTML = '<span class="err">该段原片切不出来，看服务端日志</span>'; };
  $("#pModal").hidden = false;     // 先显形再挂 src，避免隐藏态不加载
  v.src = `/clip/${VID}/${seg}.mp4`;
  renderStrip();                   // 让卡片带上 playing 态
  v.play().catch(() => {});
}

function closePlay(){
  const v = $("#pVid");
  v.onerror = null; v.onloadeddata = null;
  v.pause(); v.removeAttribute("src"); v.load();   // 停掉后台播放与下载
  $("#pModal").hidden = true;
  CURPLAY = "";
  renderStrip();
}

$("#pClose").onclick = closePlay;
$("#pModal").onclick = ev => { if (ev.target.id === "pModal") closePlay(); };
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#pModal").hidden) closePlay();
});

// ---- 跑一条 ----
$("#btnRun").onclick = async () => {
  if (!SEL || !VID) return;
  const prompt = $("#prompt").value.trim();
  if (!prompt) { log("提示词为空"); return; }
  $("#btnRun").disabled = true;
  log(`→ ${SEL} · ${$("#group").value}`);
  const { job } = await api("/api/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vid: VID, seg: SEL, prompt, group: $("#group").value })
  });
  pollJob(job, async (res, err) => {
    $("#btnRun").disabled = false;
    if (err) { log("失败：" + err); return; }
    FOCUS = null;                    // 新跑完的这条要出现在列表顶部
    log("完成 " + res.run.id);
    refresh();
  });
};

// ---- 结果 ----
async function refresh(){
  const st = await api("/api/state?vid=" + (VID || ""));
  STATE = (st && !st.error) ? st : { runs: [] };
  HISTORY = STATE.history || [];
  renderHist();
  renderRuns();
}

// ---- 左栏历史 ----
function renderHist(){
  $("#histN").textContent = HISTORY.length + " 条";
  if (!HISTORY.length) { $("#hist").innerHTML = '<div class="empty">还没有记录</div>'; return; }
  $("#hist").innerHTML = HISTORY.map(h => `
    <div class="hitem${h.key === FOCUS ? " on" : ""}${h.live ? "" : " dead"}" data-key="${h.key}">
      ${h.anchor_img ? `<img class="th" src="${h.anchor_img}" loading="lazy">`
                     : `<div class="ph">产物已覆盖</div>`}
      <div class="r1">${h.id}${h.live ? "" : '<span class="tag">覆盖</span>'}</div>
      <div class="r2"><span>${h.group || ""}</span><span>${(h.ts || "").slice(11)}</span>
        <span>${h.charged != null ? h.charged.toFixed(2) + "分" : ""}</span></div>
    </div>`).join("");
  $("#hist").querySelectorAll(".hitem").forEach(el => el.onclick = () => focusRun(el.dataset.key));
}

// 点历史 → 切到那一次：锚、提示词、结果一起回放
async function focusRun(key){
  const h = HISTORY.find(x => x.key === key);
  if (!h) return;
  FOCUS = key;
  if (h.video_id && h.video_id !== VID) {          // 跨视频：先换分段表
    const meta = await api("/api/segments?vid=" + h.video_id);
    if (meta && meta.segments) { VID = h.video_id; SEGS = meta.segments; }
  }
  if (h.seg_id && SEGS.some(s => s.seg === h.seg_id)) {
    SEL = h.seg_id; renderStrip(); $("#btnRun").disabled = false;
    $("#selN").textContent = `已选 ${SEL}`;
    $("#btnCard").disabled = false;
  }
  cardName(SEL);
  if (h.prompt) $(`#prompt`).value = h.prompt;
  log(`切到历史 ${h.id} · ${h.group || ""}${h.live ? "" : "（产物已被同 id 覆盖，只剩记录）"}`);
  renderHist(); renderRuns();
  $("#runs").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("#btnAll").onclick = () => { FOCUS = null; renderHist(); renderRuns(); };

function renderRuns(){
  const all = STATE.runs || [];
  const list = FOCUS ? HISTORY.filter(h => h.key === FOCUS) : all.slice().reverse();
  $("#runN").textContent = FOCUS ? `正在看 ${(list[0] || {}).id || ""}` : all.length + " 条";
  $("#btnAll").hidden = !FOCUS;
  if (!list.length) { $("#runs").innerHTML = '<div class="empty">还没有实验记录</div>'; return; }
  $("#runs").innerHTML = list.map(r => {
    const m = r.metrics || {};
    const gd = m.dur_measured ? m.dur_measured.toFixed(2) + "s" : "";
    return `
    <div class="card">
      <div class="rt"><b>${r.id}</b><span class="pill">${r.group || ""}</span>
        <span class="pill">${(r.params?.dur ?? "?")}s</span>
        <span class="pill">${r.charged != null ? r.charged.toFixed(2) + " 积分" : "—"}</span>
        <span class="pill">${r.task_id || "无任务号"}</span>
        ${r.live ? "" : '<span class="tag" style="margin-left:0">产物已被同 id 覆盖</span>'}</div>
      <div class="res">
        <div>
          <div class="lbl"><span>左 源段 ｜ 右 生成</span><span>${r.cmp ? "" : (r.live ? "对照未生成" : "")}</span></div>
          ${r.cmp || r.gen ? `
            <div class="vtab">
              <button class="${r.cmp ? "on" : ""}" data-i="cmp" ${r.cmp ? "" : "disabled"}>对照 · 对齐后</button>
              <button class="${r.cmp ? "" : "on"}" data-i="gen" ${r.gen ? "" : "disabled"}>原始生成${gd ? " · " + gd : ""}</button>
            </div>
            <video data-cmp="${r.cmp || ""}" data-gen="${r.gen || ""}" src="${r.cmp || r.gen}" controls preload="metadata"></video>`
            : `<div class="empty" style="border:1px dashed var(--line);border-radius:7px;padding:38px 12px;text-align:center">
                 这一条的 anchor/out.mp4 已被后一次同名实验覆盖，视频不可追</div>`}
          <div class="kpi">
            <div><b>${m.anchor_ncc ?? "—"}</b><i>ANCHOR NCC</i></div>
            <div><b>${m.motion_max ?? "—"}<small style="color:#5d6875">·格${m.motion_zone ?? "?"}</small></b><i>MOTION MAX</i></div>
            <div><b>${m.drift_max ?? "—"}</b><i>DRIFT MAX</i></div>
          </div>
        </div>
        <div>
          ${r.zones ? `<img class="zones" src="${r.zones}">` : ""}
          <div class="lbl" style="margin-top:8px"><span>提示词</span></div>
          <div style="font-size:12px;color:var(--mu);max-height:96px;overflow:auto">${(r.prompt||"").slice(0,240)}</div>
        </div>
      </div>
      <div class="note">
        <div class="nh"><b>人工批注</b><span class="ns${r.note ? " done" : ""}" data-k="${r.key || ""}">${
          r.note ? "已存 " + String(r.note.updated || "").slice(5, 16) : "尚未写"}</span></div>
        <textarea class="nt" rows="3" data-k="${r.key || ""}" placeholder="看完对照视频写一句：哪一格在动、动了多大、和源片差在哪、像不像模型自己编的。Ctrl+Enter 立即保存。">${
          esc(DRAFTS[r.key] !== undefined ? DRAFTS[r.key] : (r.note?.text || ""))}</textarea>
      </div>
    </div>`;
  }).join("");
  bindVTabs();
  bindNotes();
}

// 对照片（变速对齐）／原始生成片（原速）之间切换，尽量保持播放位置
function bindVTabs(){
  $("#runs").querySelectorAll(".vtab").forEach(tab => {
    tab.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (b.disabled) return;
      const card = tab.closest(".card"), v = card.querySelector("video");
      const src = v.dataset[b.dataset.i];
      if (!src) return;
      const t = v.currentTime, wasPlaying = !v.paused && !v.ended;
      tab.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      v.addEventListener("loadedmetadata", () => {
        if (t > 0) v.currentTime = Math.min(t, Math.max(0, (v.duration || t) - 0.05));
        if (wasPlaying) v.play().catch(() => {});
      }, { once: true });
      v.src = src;
      v.load();
    });
  });
}

// ---- 人工批注：边写边存，refresh 重绘不丢草稿 ----
const DRAFTS = {}, TIMERS = {};

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function noteStatus(k, txt, cls){
  document.querySelectorAll(`.ns[data-k="${k}"]`).forEach(el => {
    el.textContent = txt;
    el.className = "ns" + (cls ? " " + cls : "");
  });
}

function stashNote(k, text, updated){
  // 同步回内存里的两份列表，免得下次重绘显示成「尚未写」
  const put = arr => (arr || []).forEach(x => { if (x.key === k) x.note = text.trim() ? { text, updated } : null; });
  put(STATE.runs); put(HISTORY);
}

async function pushNote(k, text){
  if (!k) return;
  noteStatus(k, "保存中…");
  const res = await api("/api/note", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key: k, text })
  });
  if (res.error) { noteStatus(k, "保存失败：" + res.error, "bad"); return; }
  if (!String(text).trim()) { delete DRAFTS[k]; noteStatus(k, "尚未写"); }
  else { DRAFTS[k] = text; noteStatus(k, "已存 " + String(res.updated || "").slice(11), "done"); }
  stashNote(k, text, res.updated);
}

function bindNotes(){
  $("#runs").querySelectorAll(".nt").forEach(ta => {
    const k = ta.dataset.k;
    if (!k) return;
    if (DRAFTS[k] !== undefined && ta.value !== DRAFTS[k]) ta.value = DRAFTS[k];
    ta.oninput = () => {
      DRAFTS[k] = ta.value;
      noteStatus(k, "未保存", "dirty");
      clearTimeout(TIMERS[k]);
      TIMERS[k] = setTimeout(() => pushNote(k, ta.value), 900);
    };
    ta.onblur = () => { clearTimeout(TIMERS[k]); pushNote(k, ta.value); };
    ta.onkeydown = ev => {
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
        ev.preventDefault(); clearTimeout(TIMERS[k]); pushNote(k, ta.value);
      }
    };
  });
}

(async () => {
  // 打开即接上次分段：不然每次都要重新粘一遍路径
  const raw = await api("/probe/cards.json");
  if (Array.isArray(raw)) CARDS = Object.fromEntries(raw.map(c => [c.seg, c]));
  const st = await api("/api/state");
  if (st.vid && st.segments) {
    VID = st.vid; SEGS = st.segments.segments || [];
    const nm = String(st.segments.video || "").split(/[\\/]/).pop();
    $("#hint").textContent = `已载入 ${nm || st.vid}`;
    $("#ingState").textContent = `${SEGS.length} 段 · 点缩略图右下 ▶ 看原段`;
    renderStrip();
    const want = new URLSearchParams(location.search).get("seg");
    if (want && SEGS.some(s => s.seg === want)) {   // ?seg=S03 直接落到该段
      SEL = want; renderStrip(); $("#btnRun").disabled = false;
      $("#selN").textContent = `已选 ${SEL}`;
      loadCard(SEL, false);
    }
  }
  await refresh();
  const fk = new URLSearchParams(location.search).get("focus");
  if (fk && HISTORY.some(h => h.key === fk)) focusRun(fk);
})();
</script>
