<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.blk{width:1920px;height:1080px;position:relative;overflow:hidden;background:#0b0a08}
.blk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.blk .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,4,.30),rgba(8,6,4,.72))}
.txt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#f0e4d0}
.t1{font-size:118px;font-weight:800;letter-spacing:14px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.t2{font-size:34px;margin-top:26px;color:#cdbb9c;letter-spacing:6px}
.tag{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:26px;color:#e8c9a0;border:1px solid rgba(232,201,160,.55);padding:10px 30px;border-radius:999px;letter-spacing:8px}
.meta{position:absolute;bottom:66px;left:0;right:0;text-align:center;font-size:24px;color:#9c8f78;letter-spacing:3px}
</style></head><body>

<div class="blk" id="title">
  <img src="../img/night_screen.png">
  <div class="veil"></div>
  <div class="tag">氛围过程美学 · 第一夜</div>
  <div class="txt"><div class="t1">AI工坊的一夜</div><div class="t2">一条视频的诞生 · 全程实录</div></div>
  <div class="meta">无解说 · 环境音 · 23:14 — 05:58</div>
</div>

<div class="blk" id="end">
  <img src="../img/dawn.png">
  <div class="veil"></div>
  <div class="txt"><div class="t1" style="font-size:96px">天亮了</div><div class="t2" style="font-size:30px;margin-top:30px">这条视频，由这条流水线在昨夜造出</div></div>
  <div class="meta">AI 工作站制作 · 人类导演 · 《光影氛围化剪辑》系列</div>
</div>

</body></html>
